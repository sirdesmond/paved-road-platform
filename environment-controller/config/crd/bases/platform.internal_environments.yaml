---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: environments.platform.internal
spec:
  group: platform.internal
  names:
    kind: Environment
    listKind: EnvironmentList
    plural: environments
    shortNames:
    - env
    singular: environment
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.tier
      name: Tier
      type: string
    - jsonPath: .spec.owner.team
      name: Team
      type: string
    - jsonPath: .status.namespace
      name: Namespace
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - jsonPath: .status.expiresAt
      name: Expires
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Environment is a team's isolated slice of the platform.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              EnvironmentSpec is the whole contract a team writes.
              Keep this small. Everything absent from here is a platform default,
              and defaults are where the safety lives.
            properties:
              owner:
                description: Owner is mandatory. See the Owner type.
                properties:
                  contact:
                    description: 'Contact is where to reach the team: a Slack channel,
                      a rota, an email.'
                    minLength: 1
                    type: string
                  team:
                    description: Team is the owning team's identifier, used for labels
                      and RBAC.
                    maxLength: 40
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                required:
                - contact
                - team
                type: object
              resources:
                description: |-
                  Resources overrides the tier's default ceiling, field by field.
                  Deliberately no schema default: the API server would fill it in before
                  the controller ever saw the object, and we'd lose the ability to tell
                  "team didn't say" from "team asked for exactly this". Tier defaults are
                  logic, so they live in the controller. See status.effectiveResources for
                  what was actually applied.
                properties:
                  cpu:
                    anyOf:
                    - type: integer
                    - type: string
                    description: CPU is the total CPU the namespace may request, e.g.
                      "4" or "500m".
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  memory:
                    anyOf:
                    - type: integer
                    - type: string
                    description: Memory is the total memory the namespace may request,
                      e.g. "8Gi".
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  pods:
                    description: Pods is the maximum number of pods in the namespace.
                    format: int32
                    maximum: 200
                    minimum: 1
                    type: integer
                type: object
              tier:
                enum:
                - dev
                - staging
                - prod
                type: string
                x-kubernetes-validations:
                - message: 'tier is immutable: create a new environment at the target
                    tier and migrate to it'
                  rule: self == oldSelf
              ttl:
                description: TTL is how long a non-prod environment lives before it's
                  reaped.
                type: string
            required:
            - owner
            - tier
            type: object
            x-kubernetes-validations:
            - message: 'production environments do not expire: remove ttl, or use
                tier staging if you want it reaped'
              rule: self.tier != 'prod' || !has(self.ttl)
          status:
            description: EnvironmentStatus is written by the controller, never by
              a user.
            properties:
              conditions:
                description: Conditions follow the standard Kubernetes convention.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              effectiveResources:
                description: |-
                  EffectiveResources is the ceiling actually applied, after tier defaults
                  and any overrides. This is what the quota was built from.
                properties:
                  cpu:
                    anyOf:
                    - type: integer
                    - type: string
                    description: CPU is the total CPU the namespace may request, e.g.
                      "4" or "500m".
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  memory:
                    anyOf:
                    - type: integer
                    - type: string
                    description: Memory is the total memory the namespace may request,
                      e.g. "8Gi".
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  pods:
                    description: Pods is the maximum number of pods in the namespace.
                    format: int32
                    maximum: 200
                    minimum: 1
                    type: integer
                type: object
              expiresAt:
                description: ExpiresAt is when this environment becomes eligible for
                  reaping.
                format: date-time
                type: string
              namespace:
                description: Namespace is the namespace provisioned for this environment.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the .metadata.generation this status reflects.
                  Without it you can't tell "reconciled and healthy" from "not looked at yet".
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
