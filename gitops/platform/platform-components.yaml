apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-components
  namespace: argocd
spec:
  goTemplate: true
  # Fail loudly on a typo'd field instead of rendering an empty string into
  # something important. Worth having on from day one.
  goTemplateOptions: ["missingkey=error"]

  generators:
    - cluster: 
        selector:
          matchLabels:
            paved-road/platform: "true"
        
  template:
    metadata:
      name: 'environment-controller-{{.nameNormalized}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/sirdesmond/paved-road-platform.git
        targetRevision: main
        path: environment-controller/config/default
      destination:
        server: '{{.server}}'
        namespace: environment-controller-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true